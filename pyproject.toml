[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "addrmatch"
version = "0.1.0"
description = "Address normalization (libpostal) and explainable matching POC"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "libpostal: requires the native libpostal library, data files and Python binding",
]
